name: site-check

on:
  push:
    branches: [production, master, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run static-site sanity checks
        run: python3 scripts/check-site.py
